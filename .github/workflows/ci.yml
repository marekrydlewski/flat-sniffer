name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        run: uv run --group dev ruff check .

      - name: Format check (ruff)
        run: uv run --group dev ruff format --check .

      - name: Type check (ty)
        run: uv run --group dev ty check .

      - name: Unit tests
        run: uv run python -m unittest discover tests

      - name: Verify JavaScript syntax
        run: node --check templates/app.js

      - name: Test dashboard render
        run: uv run render_dashboard.py --out /tmp/smoke-dashboard.html
