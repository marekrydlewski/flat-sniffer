name: flat-sniffer

on:
  schedule:
    - cron: "0 8 * * *" # everyday, 08:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "render_dashboard.py"
      - "price_history.py"
      - "registry.json"
      - "sold_registry.json"
      - "history.log"
      - ".github/workflows/flat-sniffer.yml"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: flat-sniffer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Run flat-sniffer
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run flat_sniffer.py --quiet --events-out events.json

      - name: Update known sold offers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: uv run scan_sold.py --out sold_registry.json

      - name: Commit updated registry
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "flat-sniffer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add registry.json history.log sold_registry.json
          git diff --cached --quiet || git commit -m "Update registry [skip ci]"
          git push

      - name: Open issue if something changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f events.json ]; then
            count=$(python3 -c 'import json; print(len(json.load(open("events.json"))))')
            if [ "$count" != "0" ]; then
              uv run format_issue.py events.json > issue_body.md
              gh issue create --title "flat-sniffer: $(date -u +%Y-%m-%d) - $count change(s)" --body-file issue_body.md
            else
              echo "No changes, skipping issue."
            fi
          fi

      - name: Fetch dashboard history from issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --state all --limit 100 --json createdAt,body > issue-history.json

      - name: Build availability dashboard
        run: |
          mkdir -p site
          [ -f events.json ] || echo "[]" > events.json
          uv run render_dashboard.py --events events.json --sold sold_registry.json --issue-history issue-history.json --history history.log --out site/index.html

      - name: Upload availability dashboard
        uses: actions/upload-artifact@v4
        with:
          name: flat-availability-dashboard
          path: site/index.html
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify on failure
        if: (failure() || cancelled()) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="The scheduled run failed or was cancelled (e.g. by the job timeout) before completing normally (network error, corrupted registry, a suspicious/degraded scrape, or a failed issue post). Check the run log to see whether the registry was updated before the failure. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # events.json may still hold this run's real diff even if a later step
          # (issue creation) is what failed - surface it here so it isn't lost.
          if [ -f events.json ] && [ "$(python3 -c 'import json; print(len(json.load(open("events.json"))))' 2>/dev/null)" != "0" ]; then
            body="$body

          Changes detected this run (may or may not be reflected in registry.json/history.log yet - check the log):

          $(uv run format_issue.py events.json 2>/dev/null || echo '(failed to render diff)')"
          fi

          gh issue create \
            --title "flat-sniffer: check failed on $(date -u +%Y-%m-%d)" \
            --body "$body"
